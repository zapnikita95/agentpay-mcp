# yaml-language-server: $schema=https://smithery.ai/schema.json
name: agentpay
title: AgentPay (Russia)
description: Russia only. Controlled AI agent budget in allowlisted specialty stores. Not x402/crypto.
startCommand:
  type: stdio
  configSchema:
    type: object
    required: ["agentpayApiKey"]
    properties:
      agentpayApiUrl:
        type: string
        description: Public AgentPay API origin
      agentpayApiKey:
        type: string
        description: Agent API key (ap_…)
  commandFunction: |-
    (config) => ({
      command: "node",
      args: ["dist/index.js"],
      env: {
        AGENTPAY_API_URL: config.agentpayApiUrl || "https://agentpay.shop/ap",
        AGENTPAY_API_KEY: config.agentpayApiKey
      }
    })
